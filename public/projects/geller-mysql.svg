  <text x="490" y="232" fill="#e4c48a" font-family="Consolas, monospace" font-size="16">expedientes</text>
  <text x="490" y="280" fill="#9a9386" font-family="Consolas, monospace" font-size="14">id_expediente  PK</text>
  <text x="490" y="308" fill="#9a9386" font-family="Consolas, monospace" font-size="14">id_cliente  FK</text>
