  <path d="M420 310 H470" stroke="#c8a36a" stroke-width="2"/>
  <path d="M810 310 H860" stroke="#c8a36a" stroke-width="2"/>
  <rect x="80" y="520" width="1120" height="200" rx="14" fill="#1a1f18" stroke="#c8a36a" stroke-opacity="0.2"/>
  <text x="110" y="570" fill="#6ee7b7" font-family="Consolas, monospace" font-size="16">SELECT e.nro, c.nombre, a.fecha</text>
  <text x="110" y="610" fill="#9a9386" font-family="Consolas, monospace" font-size="16">FROM expedientes e</text>
  <text x="110" y="650" fill="#9a9386" font-family="Consolas, monospace" font-size="16">JOIN clientes c ON c.id_cliente = e.id_cliente;</text>
